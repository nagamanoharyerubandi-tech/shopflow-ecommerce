{% extends 'base.html' %}
{% load static %}

{% block title %}Forgot Password | ShopFlow{% endblock %}

{% block content %}
<div class="container py-5">
    
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
            
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-key-fill display-3 text-warning mb-2"></i>
                    <h4 class="fw-bold mb-1">Password Assistance</h4>
                    <p class="text-muted small">Enter the email address associated with your ShopFlow account.</p>
                </div>

                <form method="POST" action="{% url 'accounts:forgot_password' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mb-3 shadow-sm">
                        Reset Password
                    </button>

                    <div class="text-center">
                        <a href="{% url 'accounts:login' %}" class="small text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i>Back to Sign In
                        </a>
                    </div>
                </form>

            </div>

        </div>
    </div>

</div>
{% endblock %}
